[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "admissions-assistant"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "anthropic==1.8.0",
    "google-genai==2.25.0",
    "psycopg[binary,pool]==3.3.6",
    "psycopg-pool==3.3.3",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "itsdangerous==2.2.0",
    "cryptography==50.0.1",
    "sentry-sdk==2.70.0",
    "tzdata==2026.4",  # timezone data on Windows and slim Linux images (D-016)
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",  # parallel tests: the gate was over 5 minutes (O-006)
    "coverage==7.16.1",
    "ruff==0.16.8",
    "hypothesis==6.168.0",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
]

[tool.setuptools]
packages = ["app", "app.channels"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config -n auto -m 'not live'"  # live: on demand only
filterwarnings = [
    "error",
    # starlette 1.6.0 uses an anyio alias deprecated in anyio 4.15 (upstream, not our code).
    # Remove when starlette stops using it. Tracked in DECISION.md open items.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
markers = ["live: calls a real external API; run on demand, never in CI"]

[tool.coverage.run]
branch = true
source = ["app"]
patch = ["subprocess"]  # measure the parallel test workers too

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
