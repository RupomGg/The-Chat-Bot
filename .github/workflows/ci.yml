# Runs the INSTRUCTION.md §2 gate on every push and pull request,
# on Linux, Windows and macOS (D-009: the same code must behave the same everywhere).
# No secrets needed: tests generate their own keys.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    env:
      TEST_DATABASE_URL: postgresql://chatbot_test:chatbot_test@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # PostgreSQL 18 on all three OSes (Docker service containers only exist on Linux).
      # Pinned to the v8 commit because it's third-party code.
      - uses: ikalnytskyi/action-setup-postgres@c4dda34aae1c821e3a771b68b73b13af3198a7ee
        id: postgres
        with:
          postgres-version: "18"

      # The action's user is a superuser. Tests run as a limited login, like locally (O-004).
      - name: Create limited test login
        run: >
          psql "${{ steps.postgres.outputs.connection-uri }}" -v ON_ERROR_STOP=1
          -c "CREATE ROLE chatbot_test LOGIN CREATEDB NOSUPERUSER PASSWORD 'chatbot_test';"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: G4 lint
        run: python -m ruff check .

      - name: G4 format
        run: python -m ruff format --check .

      - name: G1 + G5 tests (warnings are errors via pyproject)
        run: python -m pytest -q

      - name: G2/G3 coverage 100% lines and branches
        run: |
          python -m coverage run -m pytest -q
          python -m coverage report --fail-under=100

      - name: G6 reverse file order
        run: python -m pytest -q $(ls tests/test_*.py | sort -r)
